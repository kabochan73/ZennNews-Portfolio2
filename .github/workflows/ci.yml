name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Pint, Larastan, Pest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: zennnews
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: zennnews_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zennnews"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # phpunit.xml forces the database name (zennnews_test); the host comes from here.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: zennnews
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          coverage: none

      - name: Get the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint, Larastan)
        run: composer lint

      - name: Test (Pest)
        run: ./vendor/bin/pest

  frontend:
    name: Frontend (ESLint, Prettier, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, Prettier)
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      # Also type-checks. The build never calls Laravel, so none is needed here.
      - name: Build
        run: npm run build
